<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Carbomax — Sizning avtomobilingiz uchun mukammal yechim</title>
<meta name="description" content="Carbomax — Toshkentdagi avtomobil chexollari va aksessuarlar do'koni. 1998-yildan beri ustalik bilan." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    /* Brand */
    --brand-green: #2f8a3e;
    --brand-green-bright: #45b958;
    --brand-amber: #f5b023;

    /* Dark surfaces — slight green undertone, near-black */
    --bg: #0a0e0a;
    --bg-2: #0d130e;
    --surface: #131a14;
    --surface-2: #181f1a;
    --elevated: #1c2520;
    --border: #232b25;
    --border-strong: #2e3830;

    --fg: #f1f3ee;
    --fg-muted: #a1a89e;
    --fg-dim: #6a7167;

    --primary: var(--brand-green);
    --primary-bright: var(--brand-green-bright);
    --accent: var(--brand-amber);

    --shadow-1: 0 1px 0 rgba(255,255,255,0.04) inset, 0 1px 2px rgba(0,0,0,0.6);
    --shadow-glass: 0 1px 0 rgba(255,255,255,0.05) inset, 0 24px 80px -20px rgba(0,0,0,0.65);

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
    --r-xl: 20px;

    /* Density — scaled via tweak */
    --density: 1;
    --gap-section: calc(110px * var(--density));
    --pad-section: calc(96px * var(--density));

    /* Type */
    --font-display: "Sora", "Geist", system-ui, sans-serif;
    --font-sans: "Geist", "Inter", system-ui, -apple-system, sans-serif;
    --font-mono: "Geist Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
  }

  [data-theme="light"] {
    --bg: #f6f5f0;
    --bg-2: #ecebe4;
    --surface: #ffffff;
    --surface-2: #f6f5f0;
    --elevated: #ffffff;
    --border: #e4e1d6;
    --border-strong: #cfccc0;
    --fg: #181c19;
    --fg-muted: #5a6058;
    --fg-dim: #8a8f86;
    --shadow-glass: 0 1px 0 rgba(255,255,255,0.7) inset, 0 24px 80px -20px rgba(20,30,15,0.18);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  /* Background atmosphere */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(1200px 600px at 80% -10%, color-mix(in oklab, var(--primary) 18%, transparent), transparent 60%),
      radial-gradient(900px 500px at -10% 30%, color-mix(in oklab, var(--accent) 8%, transparent), transparent 60%);
    pointer-events: none;
    z-index: 0;
    opacity: 0.55;
  }
  [data-theme="light"] body::before { opacity: 0.35; }

  #root { position: relative; z-index: 1; }

  /* Type */
  .display { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.02em; line-height: 1.0; }
  .eyebrow { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-muted); }
  .mono { font-family: var(--font-mono); font-feature-settings: "tnum", "ss01"; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 18px; border-radius: 999px;
    font-family: var(--font-sans); font-size: 14px; font-weight: 500; letter-spacing: -0.005em;
    border: 1px solid transparent; cursor: pointer;
    transition: transform .15s ease, background .2s ease, border-color .2s ease, color .2s ease;
    text-decoration: none; white-space: nowrap;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--primary); color: #0a120c; }
  .btn-primary:hover { background: var(--primary-bright); }
  [data-theme="light"] .btn-primary { color: #fff; }
  .btn-ghost { background: transparent; color: var(--fg); border-color: var(--border-strong); }
  .btn-ghost:hover { background: color-mix(in oklab, var(--fg) 6%, transparent); }
  .btn-amber { background: var(--accent); color: #1a1004; }
  .btn-amber:hover { filter: brightness(1.08); }
  .btn-sm { padding: 8px 14px; font-size: 13px; }
  .btn-icon { width: 36px; height: 36px; padding: 0; border-radius: 50%; }

  /* Glass surface */
  .glass {
    background: color-mix(in oklab, var(--surface) 78%, transparent);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border-radius: var(--r-lg);
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
  }

  /* Layout */
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 720px) { .wrap { padding: 0 20px; } }

  .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 56px; flex-wrap: wrap; }
  .section-head h2 { font-size: clamp(34px, 4.3vw, 52px); margin: 8px 0 0; line-height: 1.0; }

  /* Selection */
  ::selection { background: color-mix(in oklab, var(--primary) 40%, transparent); color: var(--fg); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* Reveal-on-scroll */
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: none; }

  /* Image placeholders (striped) */
  .ph {
    background-color: var(--surface-2);
    background-image: repeating-linear-gradient(135deg,
      color-mix(in oklab, var(--fg) 4%, transparent) 0 8px,
      transparent 8px 16px);
    display: flex; align-items: center; justify-content: center;
    color: var(--fg-dim); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    border-radius: var(--r-md); border: 1px solid var(--border);
    text-align: center; padding: 12px;
  }

  /* image-slot — let the component use its built-in styling */

  /* Forms */
  .field {
    display: flex; flex-direction: column; gap: 6px;
  }
  .field label { font-size: 12.5px; color: var(--fg-muted); letter-spacing: 0.01em; font-weight: 500; }
  .field input, .field select, .field textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 12px 14px;
    color: var(--fg);
    font: inherit;
    font-size: 14px;
    transition: border-color .15s ease, box-shadow .15s ease;
    width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--primary) 22%, transparent);
  }
  .field textarea { resize: vertical; min-height: 88px; font-family: inherit; }

  /* Density variants */
  [data-density="compact"] { --density: 0.75; }
  [data-density="spacious"] { --density: 1.2; }

  noscript { display: none; }

  /* Hide scrollbars on horizontal scrollers */
  .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
</style>
</head>
